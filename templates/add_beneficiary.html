{% extends "layout.html" %}

{% block title %}
    Add beneficiary
{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-body">
                <h2 class="card-title mb-3">Add Beneficiary</h2>

                <form action="/admin/add_beneficiary" method="POST" onsubmit="return validateForm()">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <input class="form-control" type="text" id="name" name="name" required placeholder="name" minlength="3">
                        </div>
                        <div class="col-md-4">
                            <input class="form-control" type="text" id="phone" name="phone" required placeholder="phone" minlength="11" maxlength="11">
                        </div>
                        <div class="col-md-5">
                            <input class="form-control" type="text" id="national_id" name="national_id" required placeholder="national_id" minlength="14" maxlength="14">
                        </div>
                    </div>
                    <hr>

                    <div class="row g-2 align-items-end">
                        <div class="col">
                            <select class="form-select" id="medicine" name="medicine_id">
                                <option value="" disabled selected>Choose medicine</option>

                                {% for medicine in medicines %}
                                    <option value="{{ medicine['name'] }}">
                                        {{ medicine['name'] }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-auto">
                            <input class="form-control" type="number" id="quantity" name="quantity" min="1" value="1">
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-light" onclick="addMedicine()">Add</button>
                        </div>
                    </div>
                    <hr>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover table-striped align-middle" id="medicineTable">
                            <thead>
                                <tr>
                                    <td>Medicine</td>
                                    <td>Quantity</td>
                                    <td>[+]</td>
                                    <td>[-]</td>
                                    <td>Remove</td>
                                </tr>
                            </thead>
                            <tbody id="medicineTableBody">

                            </tbody>
                        </table>
                    </div>


                    <div id="hiddenInputs"></div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-light">Save</button>
                        <button type="reset" class="btn btn-light">Reset</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
    <script>

        function addMedicine() {
            const medicineInput = document.getElementById('medicine');
            const quantityInput = document.getElementById('quantity');
            const tableBody = document.getElementById('medicineTableBody');
            const hiddenInputs = document.getElementById('hiddenInputs');
            const medVal = medicineInput.value.trim();

            let qtyVal = parseInt(quantityInput.value);

            const existing = [...tableBody.querySelectorAll('td:first-child')]
                .map(td => td.textContent.trim());

            if (existing.includes(medVal)) {
                alert('This medicine is already added!');
                return;
            }

            if (medVal && qtyVal) {
                const row = document.createElement('tr');

                row.innerHTML = `
                <td>${medVal}</td>
                <td class="qty-cell">${qtyVal}</td>
                <td><button class="btn btn-sm btn-outline-light btn-plus" type="button" onclick="changeQty(this, 1)">+</button></td>
                <td><button class="btn btn-sm btn-outline-light btn-minus" type="button" onclick="changeQty(this, -1)">-</button></td>
                <td><button class="btn btn-sm btn-outline-danger btn-remove" type="button" onclick="removeRow(this)">Remove</button></td>
            `;
                tableBody.appendChild(row);

                const hiddenMed = document.createElement('input');
                hiddenMed.type = 'hidden';
                hiddenMed.name = 'medicines[]';
                hiddenMed.value = medVal;

                const hiddenQty = document.createElement('input');
                hiddenQty.type = 'hidden';
                hiddenQty.name = 'quantities[]';
                hiddenQty.value = qtyVal;

                hiddenInputs.appendChild(hiddenMed);
                hiddenInputs.appendChild(hiddenQty);

                medicineInput.value = '';
                quantityInput.value = '1';
            }};

        function changeQty(btn, delta) {
            const tableBody = document.getElementById('medicineTableBody');
            const hiddenInputs = document.getElementById('hiddenInputs');
            const row = btn.parentElement.parentElement;
            const qtyCell = row.querySelector(".qty-cell");
            let qtyVal = parseInt(qtyCell.textContent);

            if (qtyVal + delta < 1) return;

            qtyVal += delta;
            qtyCell.textContent = qtyVal;

            const index = [...tableBody.rows].indexOf(row);
            hiddenInputs.querySelectorAll("input[name='quantities[]']")[index].value = qtyVal;
        };

        function removeRow(btn) {
            const tableBody = document.getElementById('medicineTableBody');
            const hiddenInputs = document.getElementById('hiddenInputs');
            const row = btn.parentElement.parentElement;
            const index = [...tableBody.rows].indexOf(row);

            const hiddenMeds = hiddenInputs.querySelectorAll("input[name='medicines[]']");
            const hiddenQtys = hiddenInputs.querySelectorAll("input[name='quantities[]']");

            hiddenMeds[index].remove();
            hiddenQtys[index].remove();
            row.remove();
        };

        function validateForm() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const national_id = document.getElementById('national_id').value.trim();

            const governorateCodes = [
                "01", "02", "03", "04",
                "11", "12", "13", "14", "15", "16", "17", "18", "19",
                "21", "22", "23", "24", "25", "26", "27", "28", "29",
                "31", "32", "33", "34", "35", "88"
            ];
            const governorateCode = national_id.substring(7, 9);

            const nameRegex = /^[a-zA-Z\u0600-\u06FF\s]{3,}$/;
            if (!nameRegex.test(name)){
                showErrorToast("Invalid name");
                return false;
            }
            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone)){
                showErrorToast("Invalid phone number");
                return false;
            }
            const nationalIdRegex = /^[23][0-9]{13}$/;
            if (!nationalIdRegex.test(national_id) || !governorateCodes.includes(governorateCode)){
                showErrorToast("Invalid national id");
                return false;
            }
            return true;
        }

        function showErrorToast(message) {
            let container = document.querySelector('.toast-container');
            if(!container) {
                container = document.createElement('div');
                container.className = 'toast-container position-fixed bottom-0 end-0 p-3'
                container.style.zIndex = '9999';
                document.body.appendChild(container);
            }


            const toastEl = document.createElement('div');
            toastEl.innerHTML = `
            <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="4000">
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                </div>
            </div>
            `;

            const toast = toastEl.firstElementChild;
            container.appendChild(toast);
            bootstrap.Toast.getOrCreateInstance(toast).show()
        }
    </script>
{% endblock %}
